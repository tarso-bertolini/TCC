; PlatformIO project for the quantised PPO microgrid policy.
; Targets the ESP32-WROOM-32 dev board used in the bench setup.

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -std=gnu++17
    -DTF_LITE_STATIC_MEMORY
    -DCORE_DEBUG_LEVEL=3
    -DESP32_POLICY_LATENCY_LOG=1

lib_deps =
    https://github.com/tensorflow/tflite-micro-arduino-examples.git#v2.4.1
    bblanchon/ArduinoJson@^7.0.4

board_build.partitions = no_ota.csv
